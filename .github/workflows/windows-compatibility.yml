name: Windows compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'scripts/**', 'tests/**', 'extension/**', 'package*.json', '.github/workflows/windows-compatibility.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ['22.22.2', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run install:preview
      - run: node scripts/verify-store-install.mjs --on-disposable-ci
      - run: npm run package
      - run: npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.os }}-node-${{ matrix.node }}
          path: dist/
